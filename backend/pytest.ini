[pytest]
# Run pytest from inside backend/ directory: cd backend && pytest
# pythonpath adds backend/ itself to sys.path so imports like
# `from tools.xxx import ...` and `from agents.xxx import ...` work correctly.
pythonpath = .

# Only discover tests inside the tests/ subdirectory.
# This excludes the loose test_extraction.py script (which is a __main__ script,
# not a pytest test) and avoids any accidental discovery from parent dirs.
testpaths = tests

# Inherit marker definitions and asyncio settings.
markers =
    integration: mark test as live network integration test
    live: mark test as requiring live web connection
asyncio_mode = auto
